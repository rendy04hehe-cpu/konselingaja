{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teman Bicara — Percakapan</title>
    <meta name="description" content="Ruang percakapan pribadimu bersama Teman Bicara AI.">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="{% static 'css/chat.css' %}">
</head>
<body>

    <div class="app-shell" id="app-shell">

        <header class="chat-header" role="banner">
            <div class="chat-header-inner">
                <div class="header-left">
                    <button class="btn-back" type="button" onclick="window.location.href='/'" aria-label="Kembali">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        <span>Kembali</span>
                    </button>
                </div>

                <div class="header-center">
                    <span class="header-name">Teman Bicara</span>
                    <span class="header-status">Siap mendengarkan</span>
                </div>

                <div class="header-right">
                    <button class="btn-icon" id="btn-history" type="button" onclick="openHistoryDrawer()" aria-label="Riwayat percakapan">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </button>
                    <button class="btn-icon" id="btn-new-chat" type="button" onclick="startNewConversation()" aria-label="Percakapan baru">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="chat-main" id="chat-main" role="main" aria-live="polite">
            <div class="chat-thread" id="chat-thread"></div>
        </main>

        <footer class="chat-footer" role="contentinfo">
            <div class="input-shell" id="input-shell">
                <label for="chat-input" class="sr-only">Ketik pesanmu</label>
                <textarea
                    class="chat-input"
                    id="chat-input"
                    name="chat-input"
                    placeholder="Ceritakan apa yang kamu rasakan..."
                    rows="1"
                    maxlength="4000"
                    aria-label="Ketik pesanmu"
                    autocomplete="off"
                    spellcheck="false"
                ></textarea>

                <button class="btn-send" id="btn-send" type="button" onclick="handleSend()" aria-label="Kirim pesan" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <!-- ================================================
         Drawer Riwayat Percakapan
         ================================================ -->
    <div class="history-overlay" id="history-overlay" aria-hidden="true">
        <div class="history-panel" role="dialog" aria-modal="true" aria-labelledby="history-title">
            <div class="history-head">
                <h2 class="history-title" id="history-title">Riwayat</h2>
                <button class="history-close" type="button" onclick="closeHistoryDrawer()" aria-label="Tutup riwayat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Konten diisi oleh JS -->
            <div class="history-body" id="history-body"></div>

            <!-- Footer: tersedia saat user login -->
            <div class="history-foot" id="history-foot" hidden>
                <button class="history-logout" type="button" onclick="logoutChat()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Keluar
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/chat.js' %}"></script>
</body>
</html>
